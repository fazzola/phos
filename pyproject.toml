[project]
name = "phos-robot"
dynamic = ["version"]
description = "Modular personal robot for Raspberry Pi"
requires-python = ">=3.9"

[project.optional-dependencies]
web = ["Flask>=3.1,<4", "Flask-WTF>=1.2,<2", "Werkzeug>=3.1,<4", "waitress>=3.0.2,<4"]
aws = ["boto3>=1.34"]
vision = [
    "opencv-python-headless>=4.8",
    "picamera2>=0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"robot.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.dynamic]
version = {attr = "robot.__version__"}

[tool.setuptools.data-files]
"share/phos/config" = ["config/phos.json"]
