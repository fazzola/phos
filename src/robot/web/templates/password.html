{% extends 'base.html' %}
{% block content %}
<section class="account"><h2>Change administrator password</h2>
{% if required %}<p class="notice">First login: change the bootstrap password before editing configuration.</p>{% endif %}
<p>Use a different password with 12–256 characters. This ends all authenticated sessions.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" maxlength="256" required>
<label for="new">New password</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<label for="confirmation">Confirm new password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<button>Change password</button></form></section>
{% endblock %}
