{
  "openapi": "3.1.0",
  "info": {
    "title": "PHOS Local API",
    "version": "1.2.0",
    "description": "Provider-neutral local control and observation API. It exposes semantic PHOS state only; it never exposes hardware, GPIO, provider, camera-frame, or renderer implementation details. Disabled, unavailable, stale, and warming-up subsystems remain explicit in responses."
  },
  "servers": [{"url": "http://127.0.0.1:8080", "description": "Default local administration binding"}],
  "tags": [{"name": "Status"}, {"name": "Control"}, {"name": "Configuration"}, {"name": "Events"}],
  "paths": {
    "/api/v1/status": {"get": {"tags": ["Status"], "summary": "Get consolidated PHOS status", "responses": {"200": {"description": "Current semantic status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RobotStatus"}}}}, "500": {"$ref": "#/components/responses/InternalError"}}}},
    "/api/v1/state": {"get": {"tags": ["Status"], "summary": "Get robot lifecycle state", "responses": {"200": {"description": "State", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RobotState"}}}}}}, "post": {"tags": ["Control"], "summary": "Set a semantic robot state", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StateCommand"}, "example": {"state": "sleeping"}}}}, "responses": {"200": {"description": "Applied state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RobotState"}}}}, "400": {"$ref": "#/components/responses/InvalidState"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/environment": {"get": {"tags": ["Status"], "summary": "Get environmental reading availability", "responses": {"200": {"description": "Environmental status; measurements are null while unavailable or stale.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EnvironmentStatus"}}}}}}},
    "/api/v1/motion": {"get": {"tags": ["Status"], "summary": "Get motion sensor availability", "responses": {"200": {"description": "Motion status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MotionStatus"}}}}}}},
    "/api/v1/health": {"get": {"tags": ["Status"], "summary": "Get runtime and subsystem health", "responses": {"200": {"description": "Health summary", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthStatus"}}}}}}},
    "/api/v1/config": {"get": {"tags": ["Configuration"], "summary": "Get saved and active configuration", "responses": {"200": {"description": "Canonical configuration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConfigStatus"}}}}, "503": {"$ref": "#/components/responses/Unavailable"}}}, "patch": {"tags": ["Configuration"], "summary": "Validate and update supported canonical configuration fields", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConfigPatch"}, "example": {"display": {"base_visual_source": "environment"}}}}}, "responses": {"200": {"description": "Saved configuration and application result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConfigUpdate"}}}}, "400": {"$ref": "#/components/responses/InvalidConfiguration"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/expression": {"post": {"tags": ["Control"], "summary": "Trigger a semantic expression", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExpressionCommand"}, "example": {"expression": "curious"}}}}, "responses": {"200": {"description": "Expression accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExpressionState"}}}}, "400": {"$ref": "#/components/responses/InvalidExpression"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/visual-source": {"post": {"tags": ["Control"], "summary": "Set the semantic visual source", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VisualSourceCommand"}, "example": {"source": "environment"}}}}, "responses": {"200": {"description": "Visual source accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VisualSourceState"}}}}, "400": {"$ref": "#/components/responses/InvalidVisualSource"}}}},
    "/api/v1/events": {"get": {"tags": ["Events"], "summary": "Subscribe to low-rate semantic events", "description": "WSGI compatibility transport: Server-Sent Events, not a WebSocket. Event payloads are emitted only for meaningful changes and duplicate consecutive payloads are suppressed.", "responses": {"200": {"description": "SSE event stream", "content": {"text/event-stream": {"schema": {"type": "string"}, "example": "event: health_changed\\ndata: {\\\"type\\\":\\\"health_changed\\\",\\\"timestamp\\\":\\\"2026-09-27T12:00:00.000+00:00\\\",\\\"payload\\\":{}}\\n\\n"}}}}}}
  },
  "components": {"schemas": {
    "RobotState": {"type": "object", "required": ["state", "running"], "properties": {"state": {"type": "string", "enum": ["idle", "listening", "thinking", "speaking", "sleeping", "error"]}, "running": {"type": "boolean"}}},
    "ExpressionState": {"type": "object", "required": ["expression"], "properties": {"expression": {"type": "string", "enum": ["neutral", "happy", "curious", "surprised", "sleepy", "worried"]}}},
    "VisualSource": {"type": "string", "enum": ["manual", "environment", "state"]},
    "VisualSourceCommand": {"type": "object", "required": ["source"], "properties": {"source": {"$ref": "#/components/schemas/VisualSource"}}},
    "VisualSourceState": {"type": "object", "required": ["source"], "properties": {"source": {"$ref": "#/components/schemas/VisualSource"}}},
    "StateCommand": {"type": "object", "required": ["state"], "properties": {"state": {"type": "string", "enum": ["idle", "listening", "thinking", "speaking", "sleeping", "error"]}}},
    "ExpressionCommand": {"type": "object", "required": ["expression"], "properties": {"expression": {"$ref": "#/components/schemas/ExpressionState/properties/expression"}}},
    "VisualState": {"type": "object", "properties": {"expression": {"$ref": "#/components/schemas/ExpressionState/properties/expression"}, "accent": {"type": "string", "enum": ["neutral", "warm", "cool", "curious", "alert", "sleepy", "error"]}, "ambient_overlay": {"$ref": "#/components/schemas/EnvironmentalOverlayState"}, "motion_state": {"type": ["string", "null"]}}},
    "EnvironmentalOverlayState": {"type": "object", "properties": {"temperature": {"type": "string", "enum": ["none", "cold", "warm"]}, "air_quality": {"type": "string", "enum": ["none", "air_quality_warning", "air_quality_bad"]}}},
    "EnvironmentStatus": {"type": "object", "required": ["status", "available"], "properties": {"status": {"type": "string", "enum": ["available", "warming_up", "stale", "unavailable", "disabled", "starting", "stopped"]}, "available": {"type": "boolean"}, "measurements": {"type": ["object", "null"], "description": "Null when no current reading is available."}, "last_update": {"type": ["string", "null"], "format": "date-time"}, "age_seconds": {"type": ["number", "null"]}, "error": {"type": ["string", "null"]}}},
    "MotionStatus": {"$ref": "#/components/schemas/EnvironmentStatus"},
    "SubsystemHealth": {"type": "object", "required": ["state"], "properties": {"state": {"type": "string", "enum": ["ok", "warming_up", "stale", "unavailable"]}, "detail": {"type": "string"}}},
    "HealthStatus": {"type": "object", "required": ["uptime_seconds", "python", "subsystems"], "properties": {"uptime_seconds": {"type": "number", "minimum": 0}, "python": {"type": "string"}, "subsystems": {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/SubsystemHealth"}}}},
    "RobotStatus": {"type": "object", "required": ["robot", "visual", "environment", "motion", "health"], "properties": {"robot": {"$ref": "#/components/schemas/RobotState"}, "visual": {"$ref": "#/components/schemas/VisualState"}, "environment": {"$ref": "#/components/schemas/EnvironmentStatus"}, "motion": {"$ref": "#/components/schemas/MotionStatus"}, "health": {"$ref": "#/components/schemas/HealthStatus"}}},
    "Config": {"type": "object", "description": "Full canonical non-secret RuntimeConfig document.", "additionalProperties": true},
    "ConfigPatch": {"type": "object", "description": "Partial canonical configuration document. Unknown fields are rejected.", "additionalProperties": true},
    "ConfigStatus": {"type": "object", "properties": {"saved": {"$ref": "#/components/schemas/Config"}, "active": {"$ref": "#/components/schemas/Config"}, "pending": {"type": "array", "items": {"type": "string"}}}},
    "ConfigUpdate": {"type": "object", "properties": {"saved": {"$ref": "#/components/schemas/Config"}, "applied": {"type": "array", "items": {"type": "string"}}, "pending": {"type": "array", "items": {"type": "string"}}}},
    "ApiError": {"type": "object", "required": ["error"], "properties": {"error": {"type": "object", "required": ["code", "message", "details"], "properties": {"code": {"type": "string"}, "message": {"type": "string"}, "details": {"type": "object"}}}}}
  }, "responses": {
    "InvalidVisualSource": {"description": "Unsupported visual source", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}, "example": {"error": {"code": "invalid_visual_source", "message": "Unsupported visual source.", "details": {"source": "GPIO18"}}}}}},
    "InvalidExpression": {"description": "Unsupported expression", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "InvalidState": {"description": "Unsupported state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "InvalidConfiguration": {"description": "Rejected configuration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "Unavailable": {"description": "Runtime or service unavailable", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "InternalError": {"description": "Internal runtime error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}
  }}
}
